plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.kixxippi'
version = '0.0.1-SNAPSHOT'
description = 'vinted_search'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation('org.jsoup:jsoup:1.23.2')
    implementation("org.springframework.boot:spring-boot-starter-web:4.2.0-M2")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:4.1.0")
    implementation 'org.telegram:telegrambots-springboot-longpolling-starter:10.3.0'
    implementation 'org.telegram:telegrambots-client:10.3.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
